# SapphireLib tuning profile: the golden file. tests/tuning/tune_profile_test.cpp and
# tools/analyzer/test/tunefile.test.js both parse it and check the same values, so the robot's
# reader and the tools' writer can't drift apart. Change both tests with it.
format=1
rev=7
note=turn refit from SL000041-SL000048; MCL from the sim tuner

# r7  pid.turn 0.35,0,0.0002 -> 0.42,0,0.031  (overshoot 14% -> 2%, predicted)
pid.drive = 18.2, 0, 0.71
pid.turn=0.42,0,0.031      # kP,kI,kD
model.fwd=1.02,0.198,0.047 # kS,kV,kA
model.turn=0.61,0.0452,0.0066
lift.gravityVolts=1.35
mcl.periodMs=50
mcl.filter.particleCount=400
mcl.filter.motionNoise.perInch=0.07
mcl.filter.beam.outlierProbability=0.15
mcl.filter.recovery.enabled=1
mcl.sensorLatencyMs=42.5
