name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PROS CLI
        run: pip install pros-cli

      # The kernel template (headers, libpros.a, linker scripts, common.mk) and
      # project.pros are committed, so there's no project to create. The build
      # needs two things that aren't in the repo: the ARM GCC that PROS ships
      # (see docs/SETUP.md) and firmware/liblvgl.a, which `firmware/*.a` in
      # .gitignore keeps out.
      - name: Cache ARM toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-14.3.rel1-x86_64

      - name: Install ARM toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1

      - name: Fetch liblvgl.a
        run: |
          pros conduct apply liblvgl@9.2.0 --force-apply --force
          # apply also rewrites the template's headers and project.pros; put
          # back what's committed so CI builds the repo plus only the archive
          git checkout -- .
          test -f firmware/liblvgl.a

      - name: Build
        run: |
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          arm-none-eabi-g++ -dumpfullversion
          make -j"$(nproc)"
          make check-examples

      # The checks below each run even if an earlier step failed
      # (`!cancelled()`), so one red step can't hide the others' results: a
      # formatting problem shouldn't stop the unit tests from running.

      - name: Run host-side unit tests
        if: ${{ !cancelled() }}
        run: |
          for test in tests/*/*_test.cpp; do
            name=$(basename "$test" .cpp)
            src="src/sapphirelib/$(dirname "${test#tests/}")/$(basename "$test" _test.cpp).cpp"
            # Header-only modules (util/timing.hpp, util/sequence.hpp) have no
            # matching .cpp. wait_test and sequence_test define the clock seam
            # (util/clock.hpp) themselves as a fake clock, so neither may ever
            # link src/sapphirelib/util/clock.cpp, which is PROS-bound anyway.
            [ -f "$src" ] || src=""
            # Most tests are self-contained (test + its one matching source
            # file), but some pure modules call into another module (e.g.
            # odometry_math.cpp calls sapphirelib::wrapDegrees180); list
            # those extra source files here, matching each test's own
            # "Build & run" comment.
            extra=""
            case "$test" in
              tests/control/heading_hold_test.cpp) extra="src/sapphirelib/util/angle.cpp" ;;
              tests/localization/particle_filter_test.cpp)
                extra="src/sapphirelib/localization/field_map.cpp src/sapphirelib/localization/sensor_model.cpp" ;;
              tests/localization/mount_calibration_test.cpp)
                extra="src/sapphirelib/localization/field_map.cpp src/sapphirelib/localization/sensor_model.cpp" ;;
              tests/mechanism/position_control_test.cpp) extra="src/sapphirelib/control/pid.cpp" ;;
              tests/motion/pure_pursuit_math_test.cpp) extra="src/sapphirelib/motion/path.cpp" ;;
              tests/odom/odometry_math_test.cpp) extra="src/sapphirelib/util/angle.cpp" ;;
              tests/sensors/imu_scale_math_test.cpp) extra="src/sapphirelib/util/angle.cpp" ;;
              tests/telemetry/channel_test.cpp)
                extra="src/sapphirelib/telemetry/record_ring.cpp src/sapphirelib/control/pid.cpp" ;;
              tests/telemetry/characterization_tap_test.cpp)
                extra="src/sapphirelib/telemetry/channel.cpp src/sapphirelib/telemetry/record_ring.cpp src/sapphirelib/control/pid.cpp src/sapphirelib/tuning/characterization_runner.cpp" ;;
              tests/tuning/characterization_math_test.cpp)
                extra="src/sapphirelib/control/feedforward.cpp src/sapphirelib/mechanism/position_control.cpp src/sapphirelib/control/pid.cpp" ;;
              tests/tuning/characterization_runner_test.cpp)
                extra="src/sapphirelib/tuning/characterization_math.cpp src/sapphirelib/tuning/gain_design.cpp src/sapphirelib/control/feedforward.cpp src/sapphirelib/mechanism/position_control.cpp src/sapphirelib/control/pid.cpp" ;;
              tests/tuning/gain_design_test.cpp) extra="src/sapphirelib/control/feedforward.cpp" ;;
              # reads tests/tuning/tune_profile_golden.cfg, relative to the repository root
              tests/tuning/tune_profile_test.cpp)
                extra="src/sapphirelib/localization/localizer_config.cpp src/sapphirelib/control/feedforward.cpp" ;;
            esac
            echo "== $name"
            # -pthread for record_ring_test's producer threads; harmless for
            # every other test.
            g++ -std=c++20 -Wall -pthread -Iinclude "$test" $src $extra -o "/tmp/$name"
            "/tmp/$name"
          done

      - name: Self-test the telemetry reader
        if: ${{ !cancelled() }}
        run: python tools/telemetry/slt_read.py --selftest

      # The telemetry analyzer (tools/analyzer) is plain browser JavaScript
      # with no dependencies; its parser, analysis, and tuning math run under
      # Node's built-in test runner. The file glob matters: `node --test
      # <directory>` doesn't find the tests.
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the telemetry analyzer
        if: ${{ !cancelled() }}
        run: node --test tools/analyzer/test/*.test.js

      # The simulator (tools/sim) runs JavaScript ports of the localizer,
      # odometry and motions; its tests hold the ports to the C++ tests'
      # golden values and check MCL end to end against the simulated field.
      - name: Test the simulator
        if: ${{ !cancelled() }}
        run: node --test tools/sim/test/*.test.js

      # The whole library has had its one-time format pass, so this should stay
      # green: run clang-format on what you change.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find include/sapphirelib src/sapphirelib \( -name '*.hpp' -o -name '*.cpp' \) \
            | xargs clang-format --dry-run --Werror
