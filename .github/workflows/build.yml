name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PROS CLI
        run: pip install pros-cli

      - name: Pull PROS kernel + build
        run: |
          pros conduct new . --no-default-libs --force
          pros make

      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find include/sapphirelib src/sapphirelib -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

      - name: Run host-side unit tests
        run: |
          for test in tests/*/*_test.cpp; do
            name=$(basename "$test" .cpp)
            src="src/sapphirelib/$(dirname "${test#tests/}")/$(basename "$test" _test.cpp).cpp"
            g++ -std=c++20 -Wall -Iinclude "$test" "$src" -o "/tmp/$name"
            "/tmp/$name"
          done
